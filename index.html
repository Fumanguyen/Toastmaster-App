```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toastmaster Speech Architect</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Lucide Icons for standalone usage
        const Icon = ({ name, size = 18, className = "" }) => {
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const SPEECH_TYPES = [
            { id: 'ice-breaker', label: 'Ice Breaker', desc: 'Introduce yourself to the club.' },
            { id: 'persuasive', label: 'Persuasive', desc: 'Influence thinking or behavior.' },
            { id: 'humorous', label: 'Humorous', desc: 'Entertain and share a funny story.' },
            { id: 'informational', label: 'Informational', desc: 'Explain a complex concept.' },
            { id: 'inspirational', label: 'Inspirational', desc: 'Motivate the audience.' },
        ];

        function App() {
            const [speech, setSpeech] = useState({
                title: 'My First Toastmasters Speech',
                type: 'ice-breaker',
                opening: '',
                body1: '',
                body2: '',
                body3: '',
                conclusion: '',
                notes: ''
            });

            useEffect(() => {
                // Initialize icons after render
                if (window.lucide) window.lucide.createIcons();
            }, [speech]);

            const updateField = (field, value) => {
                setSpeech(prev => ({ ...prev, [field]: value }));
            };

            const wordCount = Object.values(speech).join(' ').trim().split(/\s+/).filter(Boolean).length;
            const estTime = Math.floor(wordCount / 130);
            const estSecs = Math.floor((wordCount % 130) / (130 / 60));

            return (
                <div className="min-h-screen flex flex-col pb-20 sm:pb-0">
                    <header className="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="bg-blue-600 p-1.5 rounded-lg text-white">
                                <Icon name="mic" />
                            </div>
                            <input 
                                className="font-bold text-slate-800 bg-transparent border-none focus:ring-0 text-lg"
                                value={speech.title}
                                onChange={(e) => updateField('title', e.target.value)}
                            />
                        </div>
                        <div className="flex gap-4 text-slate-500 text-sm">
                            <span className="flex items-center gap-1"><Icon name="type" size={14}/> {wordCount} words</span>
                            <span className="flex items-center gap-1"><Icon name="clock" size={14}/> {estTime}:{estSecs < 10 ? '0' : ''}{estSecs}</span>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto w-full p-4 space-y-6">
                        <section className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Speech Type</label>
                            <select 
                                className="w-full p-2 bg-slate-50 border rounded-lg outline-none"
                                value={speech.type}
                                onChange={(e) => updateField('type', e.target.value)}
                            >
                                {SPEECH_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                            </select>
                        </section>

                        <div className="space-y-4">
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-blue-600 flex items-center gap-2">
                                    <span className="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-xs">1</span>
                                    The Opening
                                </label>
                                <textarea 
                                    className="w-full min-h-[120px] p-4 bg-white border rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="Grab attention immediately..."
                                    value={speech.opening}
                                    onChange={(e) => updateField('opening', e.target.value)}
                                />
                            </div>

                            <div className="space-y-2">
                                <label className="text-sm font-bold text-green-600 flex items-center gap-2">
                                    <span className="w-6 h-6 rounded-full bg-green-100 flex items-center justify-center text-xs">2</span>
                                    Main Points
                                </label>
                                {[1, 2, 3].map(n => (
                                    <textarea 
                                        key={n}
                                        className="w-full min-h-[80px] p-4 bg-white border rounded-xl shadow-sm mb-2 outline-none"
                                        placeholder={`Point ${n}...`}
                                        value={speech[`body${n}`]}
                                        onChange={(e) => updateField(`body${n}`, e.target.value)}
                                    />
                                ))}
                            </div>

                            <div className="space-y-2">
                                <label className="text-sm font-bold text-orange-600 flex items-center gap-2">
                                    <span className="w-6 h-6 rounded-full bg-orange-100 flex items-center justify-center text-xs">3</span>
                                    The Conclusion
                                </label>
                                <textarea 
                                    className="w-full min-h-[120px] p-4 bg-white border rounded-xl shadow-sm outline-none"
                                    placeholder="Leave them with a call to action..."
                                    value={speech.conclusion}
                                    onChange={(e) => updateField('conclusion', e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="bg-slate-800 rounded-xl p-4 text-white">
                            <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Speaker Notes</label>
                            <textarea 
                                className="w-full bg-slate-700 border-none rounded-lg p-3 text-sm focus:ring-0 outline-none min-h-[80px]"
                                placeholder="[Pause], [Eye Contact], [Gesture]..."
                                value={speech.notes}
                                onChange={(e) => updateField('notes', e.target.value)}
                            />
                        </div>
                    </main>

                    <footer className="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-around sm:hidden">
                        <button className="flex flex-col items-center text-blue-600">
                            <Icon name="edit" />
                            <span className="text-[10px]">Edit</span>
                        </button>
                        <button className="flex flex-col items-center text-slate-400">
                            <Icon name="sparkles" />
                            <span className="text-[10px]">AI Assist</span>
                        </button>
                        <button className="flex flex-col items-center text-slate-400">
                            <Icon name="save" />
                            <span className="text-[10px]">Save</span>
                        </button>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
